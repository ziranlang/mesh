name: Cloudflare Pages

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'scripts/*mesh_site.py'
      - 'scripts/test_provision_mesh_site.py'
      - '.gitea/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check Site
    if: github.ref == 'refs/heads/master'
    runs-on: build-native

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check Site
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/protocol.html
          test -f site/mesh.html
          test -f site/apps.html
          test -f site/tokens.html
          test -f site/styles.css
          test -f site/_headers
          python3 -B scripts/test_mesh_site.py

      - name: Upload Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesh-site
          path: site
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy Site
    needs: build
    if: github.ref == 'refs/heads/master' && vars.MESH_PAGES_READY == 'true'
    runs-on: build-native
    timeout-minutes: 20
    steps:
      - name: Checkout the revision for the canonical-domain verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: mesh-site
          path: site
      - name: Prepare Wrangler
        run: npm exec --yes --package=wrangler@4.152.0 -- wrangler --version
      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -s site/index.html
          : "${CLOUDFLARE_API_TOKEN:?Missing Pages deployment token}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing Cloudflare account ID}"
          test "$GITHUB_REF" = refs/heads/master
          npm exec --offline --yes --package=wrangler@4.152.0 -- wrangler pages deploy site \
            --project-name=mesh --branch=master --commit-hash="$GITHUB_SHA"
      # Project and DNS setup is handled separately by scripts/provision_mesh_site.py.
      - name: Verify canonical site bytes
        run: python3 -B scripts/verify_mesh_site.py
