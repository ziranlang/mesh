name: Generate the server's Go
description: Sets up the Ziran pinned in ziran.lock and generates the Go from the Zi sources. Run it after setup-go.
runs:
  using: composite
  steps:
    - name: Set up the pinned Ziran
      id: ziran
      uses: ./.gitea/actions/ziran
    # Fetched packages stay in the host runner's own cache between jobs. It
    # is outside the checkout, where go ./... would compile their files.
    # Gitea is the primary host of these organizations and keeps renamed
    # repositories reachable; the GitHub mirror refused anonymous fetches
    # from the Mesh runner.
    - name: Generate the Go
      shell: bash
      env:
        ZIRAN: ${{ steps.ziran.outputs.ziran }}
        GIT_CONFIG_COUNT: '3'
        GIT_CONFIG_KEY_0: url.https://git.waozi.xyz/ziranlang/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/ziranlang/
        GIT_CONFIG_KEY_1: url.https://git.waozi.xyz/kryonlabs/.insteadOf
        GIT_CONFIG_VALUE_1: https://github.com/kryonlabs/
        GIT_CONFIG_KEY_2: url.https://git.waozi.xyz/vendor/open-quantum-safe-liboqs.git.insteadOf
        GIT_CONFIG_VALUE_2: https://github.com/open-quantum-safe/liboqs.git
      run: make generate ZIRAN="$ZIRAN"
