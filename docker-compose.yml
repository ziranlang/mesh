services:
  mesh:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MESH_ADDR: 0.0.0.0:8080
      MESH_BASE_URL: https://api.example.com
      MESH_DB: /data/daochi.db
      MESH_TOKEN_SECRET_HEX: ${MESH_TOKEN_SECRET_HEX:-${DAOCHI_TOKEN_SECRET_HEX:?set MESH_TOKEN_SECRET_HEX to a stable 32-byte hex secret}}
    volumes:
      - mesh-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mesh-data:
    external: true
    name: ${MESH_DATA_VOLUME:-daochi_daochi-data}
