name: Cloudflare Pages

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'scripts/*mesh_site.py'
      - 'scripts/test_provision_mesh_site.py'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/*mesh_site.py'
      - 'scripts/test_provision_mesh_site.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check Site
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/protocol.html
          test -f site/mesh.html
          test -f site/apps.html
          test -f site/tokens.html
          test -f site/styles.css
          test -f site/_headers
          python3 -B scripts/test_mesh_site.py

      - name: Provision Mesh project and canonical domain
        if: github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 -B scripts/provision_mesh_site.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=mesh --branch=${{ github.head_ref || github.ref_name }}

      - name: Verify canonical site bytes
        if: github.ref == 'refs/heads/master'
        run: python3 -B scripts/verify_mesh_site.py
